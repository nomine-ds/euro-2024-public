name: Auto Embed Euro 2024

on:
  schedule:
    # Jalan tiap 6 jam. Cukup untuk free tier Gemini (1000 req/hari).
    - cron: "0 */6 * * *"
  workflow_dispatch:  # Bisa trigger manual dari GitHub UI

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Embed Round of 16
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/embed_events_to_supabase.py --mode key --stage "Round of 16" --skip-existing

      - name: Embed Group Stage
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/embed_events_to_supabase.py --mode key --stage "Group Stage" --skip-existing