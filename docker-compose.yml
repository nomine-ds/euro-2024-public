# docker-compose.yml
services:
  api:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CACHE_API_KEY: "${CACHE_API_KEY:?Set CACHE_API_KEY in the environment}"
      OLLAMA_HOST: http://ollama:11434
      DATA_DIR: /app/data/raw
      CHROMA_DB_PATH: /app/data/chroma_db
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw:/app/data/raw
      - ./data/chroma_db:/app/data/chroma_db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in the environment}"
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in the environment}"
        NEXT_PUBLIC_API_BASE: /api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: /api
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in the environment}"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in the environment}"
    ports:
      - "3000:3000"

  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["bot"]
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    expose:
      - "11434"